<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - StudentShop E-Commerce</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Navbar -->
  <div id="navbar-placeholder"></div>

  <main class="py-5">
    <div class="container" id="product-detail-container">
      <!-- Loading Spinner -->
      <div class="text-center my-5" id="loading-spinner">
        <div class="spinner-border text-warning" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2 text-muted">Loading product details...</p>
      </div>

      <!-- Dynamically Injected Details go here -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-1">&copy; 2026 StudentShop E-Commerce Project.</p>
    </div>
  </footer>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Global Helper JS -->
  <script src="js/app.js"></script>

  <!-- Page Specific Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Extract the product ID from URL query parameters (e.g. ?id=60c72b2f...)
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');

      if (!productId) {
        showErrorPage('No product ID specified.');
        return;
      }

      loadProductDetails(productId);
    });

    // Fetch product by ID and render detail elements
    async function loadProductDetails(id) {
      const container = document.getElementById('product-detail-container');
      const spinner = document.getElementById('loading-spinner');

      try {
        const response = await fetch(`/api/products/${id}`);
        if (!response.ok) {
          throw new Error('Product not found');
        }

        const product = await response.json();
        spinner.style.display = 'none';

        const isOutOfStock = product.stock <= 0;
        const stockStatusHtml = isOutOfStock
          ? `<span class="badge bg-danger p-2"><i class="bi bi-x-circle-fill"></i> Out of Stock</span>`
          : `<span class="badge bg-success p-2"><i class="bi bi-check-circle-fill"></i> In Stock (${product.stock} units available)</span>`;

        container.innerHTML = `
          <!-- Back button -->
          <div class="mb-4">
            <a href="products.html" class="btn btn-link text-decoration-none text-dark p-0">
              <i class="bi bi-arrow-left"></i> Back to Products
            </a>
          </div>

          <div class="row g-5">
            <!-- Product Image Column -->
            <div class="col-md-6 text-center">
              <div class="p-3 border rounded bg-white shadow-sm">
                <img src="${product.imageUrl}" class="img-fluid rounded detail-img" alt="${product.name}">
              </div>
            </div>

            <!-- Product Details Column -->
            <div class="col-md-6">
              <div class="d-flex flex-column h-100">
                <div>
                  <span class="badge bg-secondary mb-2 fs-6">${product.category}</span>
                  <h1 class="fw-bold mb-2">${product.name}</h1>
                  <div class="mb-3">${stockStatusHtml}</div>
                  <h2 class="text-primary fw-bold mb-4">$${product.price.toFixed(2)}</h2>
                  
                  <h5 class="fw-bold">Product Description</h5>
                  <p class="text-muted fs-5 leading-relaxed">${product.description}</p>
                </div>

                <!-- Add to Cart Widget -->
                <div class="mt-4 p-4 border rounded bg-light card">
                  <h5 class="fw-bold mb-3">Purchase Options</h5>
                  <div class="row g-3 align-items-center">
                    <div class="col-sm-4">
                      <label for="quantity-input" class="form-label">Quantity</label>
                      <input 
                        type="number" 
                        id="quantity-input" 
                        class="form-control" 
                        value="1" 
                        min="1" 
                        max="${product.stock}"
                        ${isOutOfStock ? 'disabled' : ''}
                      >
                    </div>
                    <div class="col-sm-8 d-grid">
                      <label class="form-label d-none d-sm-block">&nbsp;</label>
                      <button 
                        id="btn-add-to-cart" 
                        class="btn btn-warning text-dark fw-bold btn-lg" 
                        ${isOutOfStock ? 'disabled' : ''}
                      >
                        <i class="bi bi-cart-plus-fill"></i> Add to Cart
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;

        // Event listener for placing in cart
        const addToCartBtn = document.getElementById('btn-add-to-cart');
        if (addToCartBtn) {
          addToCartBtn.addEventListener('click', () => {
            const quantityVal = parseInt(document.getElementById('quantity-input').value) || 1;
            addToCart(product._id, quantityVal);
          });
        }

      } catch (error) {
        console.error('Error loading product details:', error);
        spinner.style.display = 'none';
        showErrorPage('Product not found or has been removed from catalog.');
      }
    }

    // Add selected quantity of product to cart
    async function addToCart(productId, quantity) {
      if (!isLoggedIn()) {
        showAlert('Please log in to add products to your cart!', 'warning');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1500);
        return;
      }

      try {
        const response = await fetch('/api/cart/add', {
          method: 'POST',
          headers: getAuthHeaders(),
          body: JSON.stringify({ productId, quantity })
        });

        const data = await response.json();

        if (response.ok) {
          showAlert(`Successfully added ${quantity} item(s) to your cart!`, 'success');
          // Update cart badge dynamically
          updateCartBadge();
        } else {
          showAlert(data.message || 'Could not add product to cart', 'danger');
        }
      } catch (error) {
        console.error('Error adding to cart:', error);
        showAlert('Error connecting to the server', 'danger');
      }
    }

    function showErrorPage(msg) {
      const container = document.getElementById('product-detail-container');
      container.innerHTML = `
        <div class="text-center py-5 text-danger">
          <p><i class="bi bi-exclamation-triangle-fill fs-1"></i></p>
          <h3 class="fw-bold">Oops! Something went wrong</h3>
          <p class="text-muted mb-4">${msg}</p>
          <a href="products.html" class="btn btn-dark btn-sm px-4">Return to Products</a>
        </div>
      `;
    }
  </script>
</body>
</html>
