<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - StudentShop E-Commerce</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Navbar -->
  <div id="navbar-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <h1 class="fw-bold mb-4"><i class="bi bi-cart3"></i> Shopping Cart</h1>

      <div class="row g-4" id="cart-content-row">
        <!-- Loading Spinner -->
        <div class="col-12 text-center my-5" id="loading-spinner">
          <div class="spinner-border text-warning" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-2 text-muted">Retrieving cart items...</p>
        </div>

        <!-- Dynamically Injected Cart Layout (Left: Table, Right: Summary Card) -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-1">&copy; 2026 StudentShop E-Commerce Project.</p>
    </div>
  </footer>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Global Helper JS -->
  <script src="js/app.js"></script>

  <!-- Page Specific Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Protect page: Redirect to login if guest
      if (!isLoggedIn()) {
        showAlert('Please login to access your shopping cart.', 'warning');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1500);
        return;
      }

      loadCart();
    });

    // Fetch user's cart from API and render
    async function loadCart() {
      const container = document.getElementById('cart-content-row');
      
      try {
        const response = await fetch('/api/cart', {
          headers: getAuthHeaders()
        });

        if (!response.ok) {
          throw new Error('Failed to retrieve cart info');
        }

        const cart = await response.json();
        
        // Check if cart is empty
        if (!cart.items || cart.items.length === 0) {
          container.innerHTML = `
            <div class="col-12 text-center py-5">
              <div class="fs-1 text-muted mb-3"><i class="bi bi-cart-x"></i></div>
              <h3>Your shopping cart is empty</h3>
              <p class="text-muted mb-4">Add some products to your cart before checking out!</p>
              <a href="products.html" class="btn btn-warning btn-md text-dark fw-bold px-4">Start Shopping</a>
            </div>
          `;
          return;
        }

        // Render Cart Details
        let cartItemsHtml = '';
        let totalCartPrice = 0;

        cart.items.forEach(item => {
          const product = item.product;
          
          // Fallback if product was deleted in DB
          if (!product) {
            cartItemsHtml += `
              <tr>
                <td colspan="5" class="text-muted text-center py-3">Product no longer available (Removed by Admin)</td>
                <td>
                  <button class="btn btn-danger btn-sm" onclick="removeItem('${item._id}')"><i class="bi bi-trash"></i></button>
                </td>
              </tr>
            `;
            return;
          }

          const subtotal = product.price * item.quantity;
          totalCartPrice += subtotal;

          // Check if quantity is at maximum stock
          const isMaxStock = item.quantity >= product.stock;

          cartItemsHtml += `
            <tr class="align-middle">
              <td>
                <div class="d-flex align-items-center">
                  <img src="${product.imageUrl}" alt="${product.name}" class="img-thumbnail me-3" style="width: 60px; height: 60px; object-fit: cover;">
                  <div>
                    <h6 class="mb-0 fw-bold"><a href="product-details.html?id=${product._id}" class="text-decoration-none text-dark">${product.name}</a></h6>
                    <small class="text-muted">Category: ${product.category}</small>
                  </div>
                </div>
              </td>
              <td>$${product.price.toFixed(2)}</td>
              <td>
                <div class="d-flex align-items-center gap-1">
                  <!-- Decrement button -->
                  <button class="btn btn-sm btn-outline-secondary px-2" onclick="updateQty('${product._id}', -1)" title="Decrease Quantity">
                    <i class="bi bi-dash"></i>
                  </button>
                  <!-- Quantity indicator -->
                  <span class="px-3 py-1 border rounded bg-white text-dark">${item.quantity}</span>
                  <!-- Increment button -->
                  <button class="btn btn-sm btn-outline-secondary px-2" onclick="updateQty('${product._id}', 1)" ${isMaxStock ? 'disabled' : ''} title="Increase Quantity">
                    <i class="bi bi-plus"></i>
                  </button>
                </div>
                ${isMaxStock ? '<small class="text-danger d-block mt-1">Max stock reached</small>' : ''}
              </td>
              <td class="fw-bold">$${subtotal.toFixed(2)}</td>
              <td>
                <button class="btn btn-outline-danger btn-sm" onclick="removeItem('${product._id}')" title="Remove Item">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
          `;
        });

        container.innerHTML = `
          <!-- Cart Table (Left column) -->
          <div class="col-lg-8">
            <div class="card shadow-sm p-3">
              <div class="table-responsive">
                <table class="table table-hover">
                  <thead>
                    <tr>
                      <th scope="col">Product</th>
                      <th scope="col">Price</th>
                      <th scope="col" style="width: 150px;">Quantity</th>
                      <th scope="col">Subtotal</th>
                      <th scope="col">Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${cartItemsHtml}
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- Summary Card (Right column) -->
          <div class="col-lg-4">
            <div class="card shadow-sm p-4">
              <h4 class="fw-bold mb-4">Order Summary</h4>
              <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Subtotal</span>
                <span>$${totalCartPrice.toFixed(2)}</span>
              </div>
              <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Shipping</span>
                <span class="text-success fw-bold">FREE</span>
              </div>
              <hr class="my-3">
              <div class="d-flex justify-content-between mb-4">
                <h5 class="fw-bold mb-0">Total</h5>
                <h5 class="fw-bold mb-0 text-primary">$${totalCartPrice.toFixed(2)}</h5>
              </div>
              <div class="d-grid">
                <a href="checkout.html" class="btn btn-warning btn-lg text-dark fw-bold">
                  Proceed to Checkout <i class="bi bi-arrow-right"></i>
                </a>
              </div>
            </div>
          </div>
        `;
      } catch (error) {
        console.error('Error loading cart:', error);
        container.innerHTML = `
          <div class="col-12 text-center text-danger py-5">
            <p><i class="bi bi-exclamation-triangle-fill fs-2"></i></p>
            <p>Could not load cart. Please try reloading the page.</p>
          </div>
        `;
      }
    }

    // Handles quantity updates (+1 or -1)
    async function updateQty(productId, amount) {
      try {
        const response = await fetch('/api/cart/add', {
          method: 'POST',
          headers: getAuthHeaders(),
          body: JSON.stringify({ productId, quantity: amount })
        });

        if (response.ok) {
          // Re-render cart and navbar badge
          loadCart();
          updateCartBadge();
        } else {
          const errData = await response.json();
          showAlert(errData.message || 'Failed to update quantity', 'danger');
        }
      } catch (error) {
        console.error('Error updating cart quantity:', error);
        showAlert('Error updating cart quantity', 'danger');
      }
    }

    // Completely removes a product from the cart
    async function removeItem(productId) {
      if (!confirm('Are you sure you want to remove this item from your cart?')) return;

      try {
        const response = await fetch(`/api/cart/remove/${productId}`, {
          method: 'DELETE',
          headers: getAuthHeaders()
        });

        if (response.ok) {
          showAlert('Item removed from cart', 'success');
          loadCart();
          updateCartBadge();
        } else {
          const errData = await response.json();
          showAlert(errData.message || 'Failed to remove item', 'danger');
        }
      } catch (error) {
        console.error('Error removing item from cart:', error);
        showAlert('Error removing item', 'danger');
      }
    }
  </script>
</body>
</html>
