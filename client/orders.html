<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order History - StudentShop E-Commerce</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Navbar -->
  <div id="navbar-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <h1 class="fw-bold mb-4"><i class="bi bi-receipt"></i> Order History</h1>

      <div class="row" id="orders-container">
        <!-- Loading Spinner -->
        <div class="col-12 text-center my-5" id="loading-spinner">
          <div class="spinner-border text-warning" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-2 text-muted">Retrieving your order logs...</p>
        </div>

        <!-- Dynamically Injected Orders cards go here -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-1">&copy; 2026 StudentShop E-Commerce Project.</p>
    </div>
  </footer>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Global Helper JS -->
  <script src="js/app.js"></script>

  <!-- Page Specific Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Protect page
      if (!isLoggedIn()) {
        showAlert('Please login to view your order history.', 'warning');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1500);
        return;
      }

      loadOrderHistory();
    });

    // Fetch and render orders for the logged-in user
    async function loadOrderHistory() {
      const container = document.getElementById('orders-container');
      const spinner = document.getElementById('loading-spinner');

      try {
        const response = await fetch('/api/orders', {
          headers: getAuthHeaders()
        });

        if (!response.ok) throw new Error('Failed to retrieve orders');

        const orders = await response.json();
        spinner.style.display = 'none';

        if (orders.length === 0) {
          container.innerHTML = `
            <div class="col-12 text-center py-5">
              <div class="fs-1 text-muted mb-3"><i class="bi bi-box-seam"></i></div>
              <h3>No orders found</h3>
              <p class="text-muted mb-4">You have not placed any orders yet.</p>
              <a href="products.html" class="btn btn-warning btn-md text-dark fw-bold px-4">Browse Products</a>
            </div>
          `;
          return;
        }

        let html = '';

        orders.forEach(order => {
          // Format date nicely
          const orderDate = new Date(order.createdAt).toLocaleDateString(undefined, {
            year: 'numeric',
            month: 'long',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });

          // Determine status badge class
          let badgeClass = 'bg-secondary';
          if (order.status === 'Pending') badgeClass = 'badge-status-pending';
          else if (order.status === 'Processing') badgeClass = 'badge-status-processing';
          else if (order.status === 'Shipped') badgeClass = 'badge-status-shipped';
          else if (order.status === 'Delivered') badgeClass = 'badge-status-delivered';

          // Generate items list
          let itemsHtml = '';
          order.items.forEach(item => {
            itemsHtml += `
              <li class="list-group-item d-flex justify-content-between align-items-center bg-transparent border-0 px-0 py-1">
                <span>
                  <i class="bi bi-arrow-right-short text-warning"></i>
                  ${item.name} <strong class="text-dark">x${item.quantity}</strong>
                </span>
                <span class="text-muted">$${(item.price * item.quantity).toFixed(2)}</span>
              </li>
            `;
          });

          html += `
            <div class="col-12 mb-4">
              <div class="card shadow-sm">
                <!-- Card Header -->
                <div class="card-header bg-dark text-white d-flex flex-wrap justify-content-between align-items-center py-3">
                  <div>
                    <span class="fw-normal text-muted me-2" style="font-size:0.85rem;">ORDER ID:</span>
                    <span class="font-monospace text-warning me-3" style="font-size:0.85rem;">#${order._id}</span>
                    <span class="text-muted d-block d-md-inline" style="font-size:0.85rem;">Date: ${orderDate}</span>
                  </div>
                  <div class="mt-2 mt-md-0">
                    <span class="badge ${badgeClass} text-uppercase px-3 py-2 fw-bold" style="font-size:0.85rem;">
                      ${order.status}
                    </span>
                  </div>
                </div>

                <!-- Card Body -->
                <div class="card-body">
                  <div class="row g-4">
                    <!-- Purchased Items -->
                    <div class="col-md-7">
                      <h6 class="fw-bold border-bottom pb-2 mb-2"><i class="bi bi-bag"></i> Items Purchased</h6>
                      <ul class="list-group list-group-flush mb-0">
                        ${itemsHtml}
                      </ul>
                      <div class="border-top pt-2 mt-2 d-flex justify-content-between align-items-center">
                        <span class="fw-bold">Total Bill:</span>
                        <span class="fs-5 fw-bold text-primary">$${order.totalPrice.toFixed(2)}</span>
                      </div>
                    </div>

                    <!-- Shipping Address details -->
                    <div class="col-md-5 bg-light rounded p-3 card" style="border:none;">
                      <h6 class="fw-bold mb-3"><i class="bi bi-geo-alt"></i> Shipping Details</h6>
                      <p class="mb-1" style="font-size: 0.9rem;">
                        <strong>Name:</strong> ${order.customerName}
                      </p>
                      <p class="mb-1" style="font-size: 0.9rem;">
                        <strong>Phone:</strong> ${order.phoneNumber}
                      </p>
                      <p class="mb-0" style="font-size: 0.9rem;">
                        <strong>Address:</strong><br>
                        <span class="text-muted">${order.shippingAddress}</span>
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `;
        });

        container.innerHTML = html;

      } catch (error) {
        console.error('Error loading order history:', error);
        spinner.style.display = 'none';
        container.innerHTML = `
          <div class="col-12 text-center text-danger py-5">
            <p><i class="bi bi-exclamation-triangle-fill fs-2"></i></p>
            <p>Could not retrieve order logs. Please try again later.</p>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
