<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Orders - StudentShop E-Commerce</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Navbar -->
  <div id="navbar-placeholder"></div>

  <main class="py-5">
    <div class="container" id="admin-container">
      <!-- Access Denied Message by Default -->
      <div id="access-denied" class="text-center py-5 d-none">
        <div class="fs-1 text-danger mb-3"><i class="bi bi-shield-slash-fill"></i></div>
        <h3 class="fw-bold">Access Denied</h3>
        <p class="text-muted">You do not have administrative privileges to view this page.</p>
        <a href="index.html" class="btn btn-dark btn-sm mt-3">Return to Homepage</a>
      </div>

      <!-- Main Management Dashboard Content -->
      <div id="management-content" class="d-none">
        <h1 class="fw-bold mb-4"><i class="bi bi-receipt-cutoff"></i> Order Management</h1>

        <!-- Orders Table -->
        <div class="card shadow-sm p-3">
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th scope="col">Order ID</th>
                  <th scope="col">Customer Info</th>
                  <th scope="col">Items Ordered</th>
                  <th scope="col">Total Price</th>
                  <th scope="col">Order Date</th>
                  <th scope="col" style="width: 200px;">Status / Action</th>
                </tr>
              </thead>
              <tbody id="orders-table-body">
                <!-- Dynamically loaded rows go here -->
                <tr id="table-loading">
                  <td colspan="6" class="text-center py-5">
                    <div class="spinner-border text-warning" role="status">
                      <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2 text-muted mb-0">Retrieving customer orders...</p>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-1">&copy; 2026 StudentShop E-Commerce Project.</p>
    </div>
  </footer>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Global Helper JS -->
  <script src="js/app.js"></script>

  <!-- Page Specific Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Enforce admin auth checks
      if (!isLoggedIn() || !isAdmin()) {
        document.getElementById('access-denied').classList.remove('d-none');
      } else {
        document.getElementById('management-content').classList.remove('d-none');
        loadAllOrders();
      }
    });

    // Fetch orders across all accounts and populate rows
    async function loadAllOrders() {
      const tbody = document.getElementById('orders-table-body');
      
      try {
        const response = await fetch('/api/orders', {
          headers: getAuthHeaders()
        });

        if (!response.ok) throw new Error('Failed to retrieve orders list');

        const orders = await response.json();

        if (orders.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">No customer orders have been placed yet.</td></tr>`;
          return;
        }

        let html = '';
        orders.forEach(order => {
          // Format date
          const dateStr = new Date(order.createdAt).toLocaleDateString(undefined, {
            month: 'short',
            day: 'numeric',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });

          // Compile short ordered items summary
          let itemsSummary = '<ul class="list-unstyled mb-0" style="font-size: 0.85rem;">';
          order.items.forEach(item => {
            itemsSummary += `<li>• ${item.name} <strong>x${item.quantity}</strong></li>`;
          });
          itemsSummary += '</ul>';

          // Compile status selector dropdown options
          const statusOptions = ['Pending', 'Processing', 'Shipped', 'Delivered'];
          let dropdownOptionsHtml = '';
          statusOptions.forEach(opt => {
            const isSelected = order.status === opt ? 'selected' : '';
            dropdownOptionsHtml += `<option value="${opt}" ${isSelected}>${opt}</option>`;
          });

          // Custom colors for select backgrounds
          let selectClass = 'border-warning text-dark';
          if (order.status === 'Pending') selectClass = 'bg-light border-warning text-dark';
          else if (order.status === 'Processing') selectClass = 'bg-light border-info text-info';
          else if (order.status === 'Shipped') selectClass = 'bg-light border-primary text-primary';
          else if (order.status === 'Delivered') selectClass = 'bg-light border-success text-success';

          html += `
            <tr id="row-${order._id}">
              <td>
                <span class="font-monospace text-muted" style="font-size: 0.8rem;">#${order._id}</span>
              </td>
              <td>
                <div style="font-size: 0.9rem;">
                  <strong class="text-dark">${order.customerName}</strong><br>
                  <small class="text-muted"><i class="bi bi-telephone"></i> ${order.phoneNumber}</small><br>
                  <small class="text-muted"><i class="bi bi-geo-alt"></i> ${order.shippingAddress}</small><br>
                  <small class="text-muted"><i class="bi bi-envelope"></i> ${order.user ? order.user.email : 'Deleted User'}</small>
                </div>
              </td>
              <td>${itemsSummary}</td>
              <td class="fw-bold text-primary">$${order.totalPrice.toFixed(2)}</td>
              <td class="text-muted" style="font-size: 0.85rem;">${dateStr}</td>
              <td>
                <select 
                  class="form-select form-select-sm fw-bold ${selectClass}" 
                  onchange="updateStatus('${order._id}', this)"
                >
                  ${dropdownOptionsHtml}
                </select>
              </td>
            </tr>
          `;
        });

        tbody.innerHTML = html;

      } catch (error) {
        console.error('Error fetching administrative order logs:', error);
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">Failed to load order management database.</td></tr>`;
      }
    }

    // Call PUT to update the order status
    async function updateStatus(orderId, selectElement) {
      const selectedStatus = selectElement.value;
      
      // Temporarily disable while sending request
      selectElement.disabled = true;

      try {
        const response = await fetch(`/api/orders/${orderId}`, {
          method: 'PUT',
          headers: getAuthHeaders(),
          body: JSON.stringify({ status: selectedStatus })
        });

        const data = await response.json();

        if (response.ok) {
          showAlert(`Order status updated to "${selectedStatus}"`, 'success');
          // Reload orders list to recalculate dashboard statistics and styles
          loadAllOrders();
        } else {
          showAlert(data.message || 'Failed to update order status', 'danger');
          selectElement.disabled = false;
        }
      } catch (error) {
        console.error('Error updating status:', error);
        showAlert('Error contacting server', 'danger');
        selectElement.disabled = false;
      }
    }
  </script>
</body>
</html>
