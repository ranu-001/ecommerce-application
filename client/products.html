<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - StudentShop E-Commerce</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Navbar -->
  <div id="navbar-placeholder"></div>

  <main class="py-5">
    <div class="container">
      <h1 class="fw-bold mb-4">Browse Products</h1>

      <div class="row g-4">
        <!-- Sidebar Filters -->
        <div class="col-lg-3">
          <div class="card p-3 shadow-sm">
            <h5 class="fw-bold mb-3">Categories</h5>
            <div class="d-flex flex-column gap-2" id="categories-container">
              <!-- Hardcoded popular categories + 'All' -->
              <button class="btn btn-warning text-dark category-filter-btn px-3 text-start" data-category="All">
                <i class="bi bi-tag-fill me-2"></i> All Products
              </button>
              <button class="btn btn-outline-secondary category-filter-btn px-3 text-start" data-category="Electronics">
                <i class="bi bi-laptop me-2"></i> Electronics
              </button>
              <button class="btn btn-outline-secondary category-filter-btn px-3 text-start" data-category="Accessories">
                <i class="bi bi-watch me-2"></i> Accessories
              </button>
              <button class="btn btn-outline-secondary category-filter-btn px-3 text-start" data-category="Footwear">
                <i class="bi bi-gender-ambiguous me-2"></i> Footwear
              </button>
              <button class="btn btn-outline-secondary category-filter-btn px-3 text-start" data-category="Furniture">
                <i class="bi bi-house-door me-2"></i> Furniture
              </button>
              <button class="btn btn-outline-secondary category-filter-btn px-3 text-start" data-category="Home & Kitchen">
                <i class="bi bi-cup-hot me-2"></i> Home & Kitchen
              </button>
            </div>

            <hr class="my-4">

            <!-- Reset Filters -->
            <button id="btn-reset" class="btn btn-outline-danger btn-sm w-100">
              <i class="bi bi-trash"></i> Reset All Filters
            </button>
          </div>
        </div>

        <!-- Product Grid & Search/Sort controls -->
        <div class="col-lg-9">
          <!-- Controls -->
          <div class="row g-3 mb-4 align-items-center">
            <!-- Search bar -->
            <div class="col-md-7">
              <div class="input-group">
                <input type="text" id="search-input" class="form-control" placeholder="Search products by name or description..." aria-label="Search">
                <button class="btn btn-dark" type="button" id="search-button">
                  <i class="bi bi-search"></i> Search
                </button>
              </div>
            </div>
            
            <!-- Sort selector -->
            <div class="col-md-5">
              <div class="d-flex align-items-center gap-2">
                <label for="sort-select" class="text-nowrap mb-0 text-muted">Sort By:</label>
                <select id="sort-select" class="form-select">
                  <option value="">Newest Added</option>
                  <option value="price_asc">Price: Low to High</option>
                  <option value="price_desc">Price: High to Low</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Active Filter indicator -->
          <div id="filter-indicator" class="mb-3 d-none">
            <span class="text-muted">Active Filter:</span>
            <span id="active-filter-badge" class="badge bg-warning text-dark px-3 py-2 ms-1">All</span>
          </div>

          <!-- Product Card Container -->
          <div id="products-container" class="row row-cols-1 row-cols-md-3 g-4">
            <!-- Dynamic products will be injected here -->
            <div class="col-12 text-center my-5" id="loading-spinner">
              <div class="spinner-border text-warning" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
              <p class="mt-2 text-muted">Loading products...</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-1">&copy; 2026 StudentShop E-Commerce Project.</p>
    </div>
  </footer>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Global Helper JS -->
  <script src="js/app.js"></script>
  
  <!-- Page Specific Script -->
  <script>
    // State object to keep track of current filters
    const state = {
      category: 'All',
      search: '',
      sort: ''
    };

    document.addEventListener('DOMContentLoaded', () => {
      loadProducts();
      setupEventListeners();
    });

    // Fetch and render products based on the current state filters
    async function loadProducts() {
      const container = document.getElementById('products-container');
      const spinner = document.getElementById('loading-spinner');
      
      if (spinner) spinner.style.display = 'block';
      
      try {
        // Construct query parameters
        const params = new URLSearchParams();
        if (state.category && state.category !== 'All') params.append('category', state.category);
        if (state.search) params.append('search', state.search);
        if (state.sort) params.append('sort', state.sort);

        const response = await fetch(`/api/products?${params.toString()}`);
        if (!response.ok) throw new Error('Failed to fetch products');

        const products = await response.json();
        
        if (spinner) spinner.style.display = 'none';

        if (products.length === 0) {
          container.innerHTML = `
            <div class="col-12 text-center py-5">
              <p class="text-muted fs-4">No products found matching your criteria.</p>
              <button class="btn btn-sm btn-outline-warning mt-2" onclick="resetFilters()">Clear filters</button>
            </div>
          `;
          return;
        }

        let html = '';
        products.forEach(product => {
          // Check stock level to show badges
          const isOutOfStock = product.stock <= 0;
          const stockBadge = isOutOfStock 
            ? `<span class="badge bg-danger position-absolute top-0 end-0 m-2">Out of Stock</span>` 
            : `<span class="badge bg-success position-absolute top-0 end-0 m-2">In Stock (${product.stock})</span>`;

          html += `
            <div class="col">
              <div class="card h-100 shadow-sm product-card position-relative">
                ${stockBadge}
                <img src="${product.imageUrl}" class="card-img-top" alt="${product.name}">
                <div class="card-body d-flex flex-column">
                  <span class="badge bg-secondary mb-2 align-self-start">${product.category}</span>
                  <h5 class="card-title fw-bold">${product.name}</h5>
                  <p class="card-text text-muted flex-grow-1" style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">
                    ${product.description}
                  </p>
                  <div class="d-flex justify-content-between align-items-center mt-3">
                    <span class="fs-5 fw-bold text-dark">$${product.price.toFixed(2)}</span>
                  </div>
                </div>
                <div class="card-footer bg-transparent border-top-0 d-flex gap-2">
                  <a href="product-details.html?id=${product._id}" class="btn btn-outline-secondary btn-sm flex-grow-1">Details</a>
                  <button 
                    class="btn btn-warning btn-sm flex-grow-1 text-dark fw-bold add-to-cart-btn" 
                    data-id="${product._id}"
                    ${isOutOfStock ? 'disabled' : ''}
                  >
                    <i class="bi bi-cart-plus"></i> Add
                  </button>
                </div>
              </div>
            </div>
          `;
        });
        container.innerHTML = html;
        
        // Setup listener for individual "Add to Cart" buttons
        document.querySelectorAll('.add-to-cart-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const productId = e.currentTarget.getAttribute('data-id');
            addToCartHandler(productId);
          });
        });

      } catch (error) {
        console.error('Error loading products:', error);
        if (spinner) spinner.style.display = 'none';
        container.innerHTML = `
          <div class="col-12 text-center text-danger">
            <p><i class="bi bi-exclamation-triangle-fill fs-3"></i></p>
            <p>Could not load products. Please try again later.</p>
          </div>
        `;
      }
    }

    function setupEventListeners() {
      // 1. Category filter buttons click
      const categoryButtons = document.querySelectorAll('.category-filter-btn');
      categoryButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
          // Remove active styles from other buttons
          categoryButtons.forEach(b => {
            b.className = 'btn btn-outline-secondary category-filter-btn px-3 text-start';
          });
          // Add active style to this button
          e.currentTarget.className = 'btn btn-warning text-dark category-filter-btn px-3 text-start';
          
          state.category = e.currentTarget.getAttribute('data-category');
          
          // Show indicator
          const indicator = document.getElementById('filter-indicator');
          const activeBadge = document.getElementById('active-filter-badge');
          if (state.category === 'All') {
            indicator.classList.add('d-none');
          } else {
            indicator.classList.remove('d-none');
            activeBadge.textContent = state.category;
          }

          loadProducts();
        });
      });

      // 2. Search button click and Enter key
      document.getElementById('search-button').addEventListener('click', () => {
        state.search = document.getElementById('search-input').value.trim();
        loadProducts();
      });

      document.getElementById('search-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          state.search = e.target.value.trim();
          loadProducts();
        }
      });

      // 3. Sort selection change
      document.getElementById('sort-select').addEventListener('change', (e) => {
        state.sort = e.target.value;
        loadProducts();
      });

      // 4. Reset filters button click
      document.getElementById('btn-reset').addEventListener('click', resetFilters);
    }

    function resetFilters() {
      state.category = 'All';
      state.search = '';
      state.sort = '';
      
      // Update UI inputs
      document.getElementById('search-input').value = '';
      document.getElementById('sort-select').value = '';
      document.getElementById('filter-indicator').classList.add('d-none');
      
      // Reset button styles
      const categoryButtons = document.querySelectorAll('.category-filter-btn');
      categoryButtons.forEach(b => {
        b.className = 'btn btn-outline-secondary category-filter-btn px-3 text-start';
      });
      categoryButtons[0].className = 'btn btn-warning text-dark category-filter-btn px-3 text-start';

      loadProducts();
    }

    // Add product to cart handler
    async function addToCartHandler(productId) {
      if (!isLoggedIn()) {
        showAlert('Please log in to add products to your cart!', 'warning');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1500);
        return;
      }

      try {
        const response = await fetch('/api/cart/add', {
          method: 'POST',
          headers: getAuthHeaders(),
          body: JSON.stringify({ productId, quantity: 1 })
        });

        const data = await response.json();

        if (response.ok) {
          showAlert('Product added to your cart!', 'success');
          // Update cart badge dynamically
          updateCartBadge();
        } else {
          showAlert(data.message || 'Could not add product to cart', 'danger');
        }
      } catch (error) {
        console.error('Error adding to cart:', error);
        showAlert('Error connecting to the server', 'danger');
      }
    }
  </script>
</body>
</html>
